# M2 cleaning rules. Edit patterns here; never hardcode in shipwithai_clean.py.

cleaner_version: "1.0.0"

# Drop thresholds — files failing any of these go to 02-quarantine/<reason>/
drop:
  min_word_count: 250          # body words after stripping (headings excluded)
  min_text_to_link_ratio: 0.5  # fraction of chars NOT inside markdown links
  require_h1: true             # must have at least one `# ` heading
  english_only: true           # crude stopword-ratio check
  english_stopword_ratio_min: 0.025  # 2.5% of words must be common English stopwords
  max_single_char_lines: 10          # catch ASCII-split-body bug (letter-per-line)
  max_cookie_table_lines: 20         # > N "- Cookie / - Duration / - Description" patterns → quarantine

# Whole-line drop patterns (case-insensitive). Lines matching any of these
# regexes are removed entirely. Anchored to line boundaries — partial matches
# inside a paragraph do not trigger.
cta_line_patterns:
  - '^\s*\[?\s*(sign up|get started|try it free|try for free|start free trial|free trial)\b.*$'
  - '^\s*\[?\s*(learn more|read more|click here|find out more|see more)\b.*\]?\(.*\)?\s*$'
  - '^\s*\[?\s*(subscribe|join now|join us|join the (newsletter|community))\b.*$'
  - '^\s*\[?\s*(find a job|post a job|browse jobs|view all jobs|search jobs)\b.*$'
  - '^\s*\[?\s*(download|get the|grab your)\s+(free\s+)?(template|ebook|pdf|guide|cheat\s*sheet)\b.*$'
  - '^\s*(we use cookies|this site uses cookies|cookie (policy|preferences|settings))\b.*$'
  - '^\s*(accept (all )?cookies?|manage (cookies|preferences)|reject (all )?cookies?)\s*$'
  - '^\s*(cookies?\s+improve\s+your\s+experience|by\s+(clicking|continuing|using).*you\s+(agree|consent))\b.*$'
  - '^\s*accept\s*all\s*essential\s+only.*$'                          # resume.io mashed banner
  - '^\s*\d[\d,\.]*\+?\s+users?\s+chose\s+this\s+template.*$'         # template gallery counter
  - '^\s*(\d+\.\d+|\d+/\d+)\s*$'                                       # bare rating numbers
  - '^\s*average\s+rating\b.*$'
  - '^\s*people\s*[''’]?ve\s+already\s+rated\s+it.*$'
  - '^\s*\d+(,\d{3})*\s+people\s+(rated|liked|viewed)\b.*$'
  # REMOVED: '^\s*last\s+updated\b.*$' — too aggressive, could strip body sentences. Haiku polish handles meta widgets.
  - '^\s*(filed\s+under|posted\s+(on|by))\s*$'                         # article meta labels — keep "filed under"/"posted on" (very rarely body)
  - '^.*©\s*\d{4}.*(all\s+rights\s+reserved|inc\.|llc\.?).*$'         # copyright footer
  - '^\s*©\s*\d{4}\s*[\-–—]\s*\d{4}\s+[A-Z].*$'                        # © YYYY-YYYY CompanyName
  - '^\s*©\s*\d{4}\s+[A-Z].*$'                                         # © YYYY CompanyName
  - '^\s*©\s+[A-Z][\w &.,'']+\s+\d{4}\s*$'                              # © CompanyName YYYY
  - '^\s*tags?\s*:\s*$'                                                 # bare "Tags:" label
  # Cookie-consent banner remnants (from Haiku audit Pattern A)
  - '^\s*customize\s+consent\s+preferences\s*$'
  - '^\s*(necessary|functional|analytics|performance|advertisement|preferences|targeting)\s*always\s+active\s*$'
  - '^\s*reject\s+all\s+save\s+my\s+preferences\s+accept\s+all\s*$'
  - '^\s*close\s+cookie\s+preferences\s*$'
  - '^\s*save\s+accept\s+all\s+reject\s+non[-\s]*essential\s*$'
  # Privacy/ToS modal text (Haiku Pattern B) — literal phrases only
  - '^\s*reenable\s+personalization\s*$'
  - '^.*\bdo\s+not\s+sell\s+(or\s+share\s+)?(my\s+)?personal\s+information\b.*$'
  - '^\s*you\s+have\s+chosen\s+to\s+opt[-\s]*out\b.*$'
  # Multi-bullet nav trails (Haiku Pattern C) — accepts -, *, + as bullet marker
  - '^\s*[-*+]\s*[-*+]\s*[-*+]+\s*\[[^\]]+\]\([^)]+\).*$'
  # Cookie-table list entries (Haiku Pattern E)
  - '^\s*[-*+]\s+(Cookie|Duration|Description)\s*$'
  - '^\s*This\s+cookie(,)?\s+(set|is\s+used)\s+by\b.*$'
  - '^\s*This\s+cookie\s+is\s+(used|set)\b.*$'
  - '^\s*(Cloudflare|YouTube|LinkedIn|Google\s+recaptcha)\s+(sets?|uses?)\b.*$'
  # Cookie-panel paragraph boilerplate (inspira-style)
  - '^\s*the\s+cookies\s+that\s+are\s+categorized\s+as\b.*$'
  - '^\s*(necessary|functional|analytics|performance|advertisement|targeting)\s+cookies\s+(are\s+required|help|provide|allow|enable)\b.*$'
  # REMOVED: bare cookie-category labels — too ambiguous (could be article H3 etc.).
  # Haiku polish handles cookie-panel context.
  # Newsletter / Subscribe headings (Haiku Pattern F)
  - '^\s*#{2,6}\s+(subscribe(\s+to)?|newsletter|get\s+(expert|our|the)\s+)\b.*$'
  # Trustpilot / rating widgets (Haiku Pattern H)
  - '^.*\bTrustpilot\b.*$'
  - '^.*\bexcellent\s+\d\.\d\s+out\s+of\s+5\b.*$'
  - '^\s*average:\s*\d\.\d\s*\(\d+\s+votes\)\s*$'
  - '^\s*rated\s+excellent\b.*$'
  - '^\s*(\[[^\]]+\]\([^)]+\)\s*[·•|]\s*){2,}.*$'                     # 3+ dot/bullet/pipe-separated link footer rows
  - '^\s*written\s+by\s*$'                                              # author byline label
  - '^\s*reading\s+time\b.*$'
  - '^\s*estimated\s+read\b.*$'
  - '^\s*\d+\s+min\s+read\s*$'
  - '^\s*\(\d+\s*min(s|utes)?\)\s*$'
  - '^\s*(share (on|this)|tweet|share to (facebook|twitter|linkedin|x))\s*.*$'
  - '^\s*(table of contents|toc|on this page)\s*$'

# Standalone single-word/short-phrase noise lines (from gallery-style pages).
# Matched as full-line equality (case-insensitive) after stripping.
noise_lines:
  # Resume-template gallery cruft — these are concrete enough to be safe
  - "Multiple colors"
  - "Single Color"
  - "PDF"
  # REMOVED: Save/Share/Read/Watch/View/Open/Edit/Like/Comment/Tweet/Bookmark/Print
  # Single-word UI verbs can legitimately appear as body content (e.g. a bullet
  # list of resume action verbs). Haiku polish handles UI-widget context.

# Patterns inside a line — collapse to empty so the line becomes blank/drops
inline_strip_patterns: []
