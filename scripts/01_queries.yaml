# Phase 1 Search Queries
# Each topic gets queries covering ALL career levels: fresher, intern, entry, mid, senior, executive.
# Run: python scripts/01_crawl.py --force-rescan   (re-searches even if metadata exists)

topics:

  github-portfolio:
    output_dir: 01-raw/github-portfolio
    queries:
      # general
      - "how to showcase github on resume software engineer"
      - "github profile for developers cv tips"
      - "open source contributions on resume examples"
      - "github readme profile developer job"
      - "pinned repositories resume portfolio guide"
      # fresher / intern / entry
      - "github profile for fresher developer no experience"
      - "intern resume github projects examples"
      - "entry level developer github portfolio tips"
      # mid
      - "mid level software engineer github resume 3 years experience"
      - "individual contributor github portfolio showcase resume"
      # senior / executive
      - "senior engineer github open source resume"
      - "engineering lead github profile resume"

  career-gap:
    output_dir: 01-raw/career-gap
